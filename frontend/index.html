<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sluice - Execution Firewall for Tokenized Assets</title>
    <meta
      name="description"
      content="Sluice locks token movements in escrow, checks projected pool state against policy, and settles safe transfers on-chain."
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("sluice-theme");
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

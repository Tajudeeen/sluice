name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report full dependency audit
        run: npm audit --audit-level=high || true

      - name: Verify secret-safe deployment output
        run: npm run verify:secrets

      - name: Validate Worker bundle
        run: npm run worker:dry-run

      - name: Typecheck DreamDEX frontend
        run: npm run frontend:typecheck
      - name: Test DreamDEX frontend
        run: npm run frontend:test
      - name: Typecheck worker
        run: npm run worker:typecheck
      - name: Test agent
        run: npm run test:agent
      - name: Test contracts
        run: npm test
      - name: Inject SluiceGate contract addresses
        # Public Sluice contract addresses (not secrets). Vite inlines VITE_* at
        # build time from frontend/.env, which lights up the on-chain SluiceGate
        # enforcement layer in the live build. These addresses are hardcoded in
        # wrangler.toml and are safe to embed directly; the secrets override is
        # only needed if the deployed contracts rotate.
        run: |
          GATE="${{ secrets.VITE_GATE_ADDRESS }}"
          ASSET="${{ secrets.VITE_ASSET_ADDRESS }}"
          if [ -z "$GATE" ]; then GATE="0x94037b2D299343b3D4FA02b2432512d263FB537C"; fi
          if [ -z "$ASSET" ]; then ASSET="0x8CC42b34692B5555865e92ebD9eA3F328868783a"; fi
          printf 'VITE_GATE_ADDRESS=%s\nVITE_ASSET_ADDRESS=%s\n' "$GATE" "$ASSET" > frontend/.env
      - name: Build DreamDEX frontend
        run: npm run frontend:build -- --base=/sluice/

      - name: Add SPA fallback
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          touch frontend/dist/.nojekyll

      - name: Upload verified Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-dist
          path: frontend/dist
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download verified Pages artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pages-dist
          path: frontend/dist

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          force_orphan: true

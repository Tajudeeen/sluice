name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck DreamDEX frontend
        run: npm run frontend:typecheck
      - name: Test DreamDEX frontend
        run: npm run frontend:test
      - name: Typecheck worker
        run: npm run worker:typecheck
      - name: Test agent
        run: npm run test:agent
      - name: Test contracts
        run: npm test
      - name: Build DreamDEX frontend
        run: npm run frontend:build -- --base=/sluice/

      - name: Add SPA fallback
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          touch frontend/dist/.nojekyll

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          force_orphan: true

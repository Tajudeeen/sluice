name: Deploy settlement Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "worker/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: settlement-worker-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify Worker source
        run: |
          npm run verify:secrets
          npm run worker:typecheck
          npm run test:agent
          npm test
          npm run worker:dry-run

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        run: npx wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Worker health
        env:
          WORKER_HEALTH_URL: ${{ vars.SLUICE_WORKER_URL }}
        run: |
          test -n "$WORKER_HEALTH_URL"
          curl --fail --silent --show-error --retry 10 --retry-delay 3 "$WORKER_HEALTH_URL/health" > worker-health.json
          node -e "const body=require('./worker-health.json'); if(body.ok!==true) process.exit(1); console.log(JSON.stringify({ok:body.ok,chainId:body.chainId,gate:body.gate,asset:body.asset}))"
